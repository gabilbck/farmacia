<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard de laboratórios</title>
  <link rel="stylesheet" href="/css/crud-dashboard.css" />
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="/index.html">← Voltar para o painel principal</a>
    <h1>Dashboard de laboratórios</h1>
    <p class="sub">Cadastro, listagem, edição e exclusão de laboratórios em uma única tela.</p>

    <section class="api-box">
      <h2>Endpoints</h2>
      <div class="api-list">
        <button class="api-endpoint" type="button" data-endpoint="POST /api/laboratorios"><code>POST /api/laboratorios</code><span class="copy-label">Copiar</span></button>
        <button class="api-endpoint" type="button" data-endpoint="GET /api/laboratorios"><code>GET /api/laboratorios</code><span class="copy-label">Copiar</span></button>
        <button class="api-endpoint" type="button" data-endpoint="PUT /api/laboratorios/{id}"><code>PUT /api/laboratorios/{id}</code><span class="copy-label">Copiar</span></button>
        <button class="api-endpoint" type="button" data-endpoint="DELETE /api/laboratorios/{id}"><code>DELETE /api/laboratorios/{id}</code><span class="copy-label">Copiar</span></button>
      </div>
    </section>

    <form id="formLab" class="panel">
      <h2>Novo laboratório</h2>
      <div class="grid-2">
        <div>
          <label for="cnpj">CNPJ *</label>
          <input type="text" id="cnpj" required inputmode="numeric" pattern="\d{14}" maxlength="14" />
        </div>
        <div>
          <label for="razaoSocial">Razão social *</label>
          <input type="text" id="razaoSocial" required />
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label for="nomeFantasia">Nome fantasia *</label>
          <input type="text" id="nomeFantasia" required />
        </div>
        <div>
          <label for="status">Status *</label>
          <select id="status" required>
            <option value="">-</option>
            <option value="true">Ativo</option>
            <option value="false">Inativo</option>
          </select>
        </div>
      </div>
      <div class="toolbar">
        <button type="submit" class="btn-primary">Cadastrar laboratório</button>
        <button type="button" class="btn-secondary" id="btnLimpar">Limpar formulário</button>
        <button type="button" class="btn-secondary" id="btnAtualizar">Atualizar listagem</button>
      </div>
    </form>

    <div id="msg"></div>

    <section class="panel table-panel">
      <h2>Laboratórios cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>CNPJ</th>
            <th>Razão social</th>
            <th>Nome fantasia</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none">Nenhum laboratório encontrado.</div>
    </section>
  </div>

  <dialog id="editDialog">
    <form id="editForm" method="dialog" class="dialog-form">
      <h2>Editar laboratório</h2>
      <input type="hidden" id="editId" />
      <div class="grid-2">
        <div>
          <label for="editCnpj">CNPJ *</label>
          <input type="text" id="editCnpj" required inputmode="numeric" pattern="\d{14}" maxlength="14" />
        </div>
        <div>
          <label for="editRazaoSocial">Razão social *</label>
          <input type="text" id="editRazaoSocial" required />
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label for="editNomeFantasia">Nome fantasia *</label>
          <input type="text" id="editNomeFantasia" required />
        </div>
        <div>
          <label for="editStatus">Status *</label>
          <select id="editStatus" required>
            <option value="true">Ativo</option>
            <option value="false">Inativo</option>
          </select>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn-primary">Salvar alterações</button>
      </div>
    </form>
  </dialog>

  <script>
    const state = { itens: [] };

    function showMsg(text, ok) {
      const el = document.getElementById("msg");
      el.textContent = text;
      el.className = ok ? "ok" : "err";
    }

    function clearMsg() {
      const el = document.getElementById("msg");
      el.textContent = "";
      el.className = "";
    }

    function boolToText(value) {
      return value === true ? "Ativo" : "Inativo";
    }

    function normalizarCnpj(valor) {
      return (valor || "").replace(/\D/g, "");
    }

    function cnpjValido(cnpj) {
      return /^\d{14}$/.test(cnpj);
    }

    function payloadDoForm() {
      return {
        cnpj: normalizarCnpj(document.getElementById("cnpj").value),
        razaoSocial: document.getElementById("razaoSocial").value.trim(),
        nomeFantasia: document.getElementById("nomeFantasia").value.trim(),
        status: document.getElementById("status").value === "true"
      };
    }

    function payloadEdicao() {
      return {
        cnpj: normalizarCnpj(document.getElementById("editCnpj").value),
        razaoSocial: document.getElementById("editRazaoSocial").value.trim(),
        nomeFantasia: document.getElementById("editNomeFantasia").value.trim(),
        status: document.getElementById("editStatus").value === "true"
      };
    }

    function render() {
      const tbody = document.getElementById("tbody");
      const empty = document.getElementById("empty");
      tbody.innerHTML = "";
      if (!state.itens.length) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";
      for (const lab of state.itens) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${lab.id ?? "-"}</td>
          <td>${lab.cnpj ?? "-"}</td>
          <td>${lab.razaoSocial ?? "-"}</td>
          <td>${lab.nomeFantasia ?? "-"}</td>
          <td>${boolToText(lab.status)}</td>
          <td class="actions-col">
            <button type="button" class="btn-small btn-edit" data-action="editar" data-id="${lab.id}">Editar</button>
            <button type="button" class="btn-small btn-delete" data-action="deletar" data-id="${lab.id}">Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      }
    }

    async function carregar() {
      clearMsg();
      try {
        const res = await fetch("/api/laboratorios", { headers: { Accept: "application/json" } });
        const text = await res.text();
        const data = text ? JSON.parse(text) : [];
        if (!res.ok) {
          showMsg("Erro ao carregar laboratórios (HTTP " + res.status + ").", false);
          return;
        }
        state.itens = Array.isArray(data) ? data : [];
        render();
        showMsg("Lista atualizada com " + state.itens.length + " registro(s).", true);
      } catch (err) {
        showMsg("Falha ao carregar listagem: " + err.message, false);
      }
    }

    function abrirEdicao(id) {
      const lab = state.itens.find((item) => item.id === id);
      if (!lab) return;
      document.getElementById("editId").value = lab.id;
      document.getElementById("editCnpj").value = lab.cnpj ?? "";
      document.getElementById("editRazaoSocial").value = lab.razaoSocial ?? "";
      document.getElementById("editNomeFantasia").value = lab.nomeFantasia ?? "";
      document.getElementById("editStatus").value = String(lab.status === true);
      document.getElementById("editDialog").showModal();
    }

    async function deletar(id) {
      if (!window.confirm("Deseja excluir o laboratório de ID " + id + "?")) return;
      clearMsg();
      try {
        const res = await fetch("/api/laboratorios/" + id, { method: "DELETE" });
        if (!res.ok) {
          showMsg("Erro ao excluir laboratório (HTTP " + res.status + ").", false);
          return;
        }
        state.itens = state.itens.filter((item) => item.id !== id);
        render();
        showMsg("Laboratório removido com sucesso.", true);
      } catch (err) {
        showMsg("Falha na exclusão: " + err.message, false);
      }
    }

    document.getElementById("formLab").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();
      const payload = payloadDoForm();
      if (!cnpjValido(payload.cnpj)) {
        showMsg("CNPJ deve conter somente números e exatamente 14 dígitos.", false);
        return;
      }
      try {
        const res = await fetch("/api/laboratorios", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        const data = text ? JSON.parse(text) : null;
        if (!res.ok || !data) {
          showMsg("Erro ao cadastrar laboratório (HTTP " + res.status + ").", false);
          return;
        }
        state.itens.unshift(data);
        render();
        document.getElementById("formLab").reset();
        showMsg("Laboratório cadastrado com sucesso.", true);
      } catch (err) {
        showMsg("Falha no cadastro: " + err.message, false);
      }
    });

    document.getElementById("btnLimpar").addEventListener("click", () => {
      document.getElementById("formLab").reset();
      clearMsg();
    });

    document.getElementById("tbody").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const id = Number(btn.dataset.id);
      if (!Number.isFinite(id)) return;
      if (btn.dataset.action === "editar") abrirEdicao(id);
      if (btn.dataset.action === "deletar") deletar(id);
    });

    document.getElementById("btnAtualizar").addEventListener("click", carregar);
    document.getElementById("btnCancelar").addEventListener("click", () => {
      document.getElementById("editDialog").close();
    });

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();
      const id = Number(document.getElementById("editId").value);
      if (!Number.isFinite(id)) return;
      const payload = payloadEdicao();
      if (!cnpjValido(payload.cnpj)) {
        showMsg("CNPJ deve conter somente números e exatamente 14 dígitos.", false);
        return;
      }
      try {
        const res = await fetch("/api/laboratorios/" + id, {
          method: "PUT",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        const data = text ? JSON.parse(text) : null;
        if (!res.ok || !data) {
          showMsg("Erro ao atualizar laboratório (HTTP " + res.status + ").", false);
          return;
        }
        const idx = state.itens.findIndex((item) => item.id === id);
        if (idx >= 0) state.itens[idx] = data;
        render();
        document.getElementById("editDialog").close();
        showMsg("Laboratório atualizado com sucesso.", true);
      } catch (err) {
        showMsg("Falha na atualização: " + err.message, false);
      }
    });

    async function copiarEndpoint(texto, botao) {
      try {
        await navigator.clipboard.writeText(texto);
        const antigo = botao.querySelector(".copy-label").textContent;
        botao.querySelector(".copy-label").textContent = "Copiado";
        setTimeout(() => {
          botao.querySelector(".copy-label").textContent = antigo;
        }, 1200);
      } catch (err) {
        window.alert("Não foi possível copiar automaticamente. Endpoint: " + texto);
      }
    }

    document.querySelectorAll(".api-endpoint").forEach((btn) => {
      btn.addEventListener("click", () => copiarEndpoint(btn.dataset.endpoint, btn));
    });

    ["cnpj", "editCnpj"].forEach((id) => {
      const input = document.getElementById(id);
      input.addEventListener("input", () => {
        input.value = normalizarCnpj(input.value).slice(0, 14);
      });
    });

    carregar();
  </script>
</body>
</html>
